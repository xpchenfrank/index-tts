<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexTTS API 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status.loading .status-dot {
            background: #ffc107;
        }
        
        .status.success .status-dot {
            background: #28a745;
        }
        
        .status.error .status-dot {
            background: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .audio-player {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .audio-player.show {
            display: block;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .examples {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .examples h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }
        
        .example-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #e0e0e0;
        }
        
        .example-item:hover {
            background: #e9ecef;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            border-radius: 4px;
            font-size: 14px;
            color: #0c5460;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ IndexTTS API 测试</h1>
        <p class="subtitle">文本转语音在线测试工具</p>
        
        <div id="status" class="status loading">
            <div class="status-dot"></div>
            <span id="statusText">正在连接服务...</span>
        </div>
        
        <div class="form-group">
            <label for="textInput">输入文本：</label>
            <textarea 
                id="textInput" 
                rows="6" 
                placeholder="请输入要转换为语音的文本..."
            >你好，欢迎使用IndexTTS语音合成服务。这是一个测试示例。</textarea>
        </div>
        
        <button id="generateBtn" class="btn" onclick="generateSpeech()">
            <span id="btnText">生成语音</span>
        </button>
        
        <div id="audioPlayer" class="audio-player">
            <h3>生成的语音：</h3>
            <audio id="audio" controls></audio>
            <div style="margin-top: 10px; font-size: 14px; color: #666;">
                <span id="audioInfo"></span>
            </div>
        </div>
        
        <div class="examples">
            <h3>📝 示例文本（点击使用）</h3>
            <div class="example-item" onclick="useExample(this)">
                你好，欢迎使用IndexTTS语音合成服务。
            </div>
            <div class="example-item" onclick="useExample(this)">
                今天天气真不错，适合出去走走。
            </div>
            <div class="example-item" onclick="useExample(this)">
                人工智能技术正在改变我们的生活，语音合成就是其中之一。
            </div>
            <div class="example-item" onclick="useExample(this)">
                春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。
            </div>
        </div>
        
        <div class="info">
            <strong>💡 提示：</strong> 
            首次生成可能需要较长时间加载模型。支持中英文混合输入。
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        // 检查服务状态
        async function checkService() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('success', `服务正常 | 参考音频: ${data.reference_audio.split('/').pop()}`);
                    document.getElementById('generateBtn').disabled = false;
                } else {
                    updateStatus('error', '服务异常，请检查 API 服务是否正常运行');
                }
            } catch (error) {
                updateStatus('error', '无法连接到服务，请确保 API 服务已启动 (python api.py)');
            }
        }
        
        function updateStatus(type, text) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            document.getElementById('statusText').textContent = text;
        }
        
        function useExample(element) {
            document.getElementById('textInput').value = element.textContent.trim();
        }
        
        async function generateSpeech() {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                alert('请输入文本');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const audioPlayer = document.getElementById('audioPlayer');
            
            // 禁用按钮
            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> 生成中...';
            updateStatus('loading', '正在生成语音，请稍候...');
            
            try {
                const startTime = Date.now();
                
                const response = await fetch(`${API_URL}/tts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        max_text_tokens_per_segment: 120,
                        temperature: 0.8
                    })
                });
                
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    // 更新音频播放器
                    const audio = document.getElementById('audio');
                    audio.src = url;
                    audio.load();
                    
                    // 显示信息
                    document.getElementById('audioInfo').textContent = 
                        `生成耗时: ${elapsed}秒 | 文件大小: ${(blob.size / 1024).toFixed(2)}KB`;
                    
                    audioPlayer.classList.add('show');
                    updateStatus('success', `生成成功！耗时 ${elapsed} 秒`);
                    
                    // 自动播放
                    setTimeout(() => audio.play(), 100);
                } else {
                    const error = await response.text();
                    updateStatus('error', `生成失败: ${error}`);
                    alert('生成失败: ' + error);
                }
            } catch (error) {
                updateStatus('error', '生成失败: ' + error.message);
                alert('生成失败: ' + error.message);
            } finally {
                // 恢复按钮
                btn.disabled = false;
                btnText.textContent = '生成语音';
            }
        }
        
        // 页面加载时检查服务
        window.onload = () => {
            checkService();
            // 每30秒检查一次服务状态
            setInterval(checkService, 30000);
        };
        
        // 支持回车键提交（Ctrl+Enter）
        document.getElementById('textInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                generateSpeech();
            }
        });
    </script>
</body>
</html>
